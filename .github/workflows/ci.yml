name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El harness importa requests a nivel de modulo. Todo lo demas es stdlib:
      # estas comprobaciones corren sin modelo y sin GPU a proposito, porque los
      # numeros publicados se verifican aqui y no en una maquina con grafica.
      - name: Install harness dependencies
        run: python -m pip install --upgrade pip requests

      # Solo archivos versionados: compileall recursivo se cuelga si hay un .venv
      # local (fase2/.venv) y en CI no aporta nada compilar lo ignorado.
      - name: Syntax check
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Validate datasets
        run: python scripts/check_datasets.py

      # Cada tarea del puente debe discriminar: la solucion golden pasa y una
      # solucion generica falla. Si esto se rompe, los resultados de results/ dejan
      # de significar lo que dicen.
      - name: Bridge tasks discriminate
        run: python rag/sanity_code_tasks.py
