name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --workspace=@contabilia/api ts-jest jest @types/jest
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run test --workspace=@contabilia/api
