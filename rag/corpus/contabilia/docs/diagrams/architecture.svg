<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold">Contabilidad Architecture</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-size="14">SaaS de contabilidad e IA para PyMEs</text>
  
  <!-- Frontend Box -->
  <rect x="50" y="100" width="200" height="120" fill="url(#grad1)" rx="8"/>
  <text x="150" y="135" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Frontend</text>
  <text x="150" y="155" text-anchor="middle" fill="#e0e7ff" font-size="12">Next.js 15 + React 19</text>
  <text x="150" y="175" text-anchor="middle" fill="#e0e7ff" font-size="12">Tailwind CSS + Radix UI</text>
  <text x="150" y="195" text-anchor="middle" fill="#e0e7ff" font-size="12">Dashboard + Upload</text>
  
  <!-- Arrow -->
  <line x1="250" y1="160" x2="320" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  
  <!-- API Box -->
  <rect x="320" y="100" width="200" height="120" fill="url(#grad2)" rx="8"/>
  <text x="420" y="135" text-anchor="middle" fill="white" font-size="16" font-weight="bold">API</text>
  <text x="420" y="155" text-anchor="middle" fill="#d1fae5" font-size="12">NestJS + TypeScript</text>
  <text x="420" y="175" text-anchor="middle" fill="#d1fae5" font-size="12">12 Modulos + Swagger</text>
  <text x="420" y="195" text-anchor="middle" fill="#d1fae5" font-size="12">JWT Auth + Validation</text>
  
  <!-- Arrow -->
  <line x1="520" y1="160" x2="590" y2="160" stroke="#10b981" stroke-width="2"/>
  
  <!-- Database Box -->
  <rect x="590" y="100" width="160" height="120" fill="url(#grad3)" rx="8"/>
  <text x="670" y="135" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Database</text>
  <text x="670" y="155" text-anchor="middle" fill="#fef3c7" font-size="12">PostgreSQL</text>
  <text x="670" y="175" text-anchor="middle" fill="#fef3c7" font-size="12">Prisma ORM</text>
  <text x="670" y="195" text-anchor="middle" fill="#fef3c7" font-size="12">17+ Models</text>
  
  <!-- Modules Section -->
  <text x="400" y="270" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">API Modules</text>
  
  <!-- Module boxes -->
  <rect x="50" y="290" width="120" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="6"/>
  <text x="110" y="320" text-anchor="middle" fill="#818cf8" font-size="11">Ingestion</text>
  
  <rect x="185" y="290" width="120" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="6"/>
  <text x="245" y="320" text-anchor="middle" fill="#818cf8" font-size="11">Matching</text>
  
  <rect x="320" y="290" width="120" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="6"/>
  <text x="380" y="320" text-anchor="middle" fill="#818cf8" font-size="11">Cash App</text>
  
  <rect x="455" y="290" width="120" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="6"/>
  <text x="515" y="320" text-anchor="middle" fill="#818cf8" font-size="11">Learning</text>
  
  <rect x="590" y="290" width="120" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="6"/>
  <text x="650" y="320" text-anchor="middle" fill="#818cf8" font-size="11">Dashboard</text>
  
  <!-- Features -->
  <text x="400" y="390" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">Key Features</text>
  
  <text x="100" y="420" fill="#10b981" font-size="12">✓ AI-Powered Matching</text>
  <text x="100" y="445" fill="#10b981" font-size="12">✓ Continuous Learning</text>
  <text x="300" y="420" fill="#10b981" font-size="12">✓ CSV/XLSX Ingestion</text>
  <text x="300" y="445" fill="#10b981" font-size="12">✓ Multi-Tenant SaaS</text>
  <text x="530" y="420" fill="#10b981" font-size="12">✓ Real-time Dashboard</text>
  <text x="530" y="445" fill="#10b981" font-size="12">✓ Swagger/OpenAPI</text>
  
  <!-- Footer -->
  <text x="400" y="485" text-anchor="middle" fill="#64748b" font-size="10">Built with Turborepo + TypeScript</text>
</svg>
