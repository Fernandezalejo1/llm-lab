<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- App Background -->
  <rect width="1200" height="700" fill="#0f172a" rx="12"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="700" fill="#1e293b"/>
  <text x="120" y="45" text-anchor="middle" fill="#6366f1" font-size="20" font-weight="bold">💰 Contabilidad</text>
  <rect x="20" y="70" width="200" height="36" fill="#6366f1" rx="6" opacity="0.2"/>
  <text x="120" y="94" text-anchor="middle" fill="#818cf8" font-size="13">📊 Dashboard</text>
  <text x="120" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">📁 Upload</text>
  <text x="120" y="175" text-anchor="middle" fill="#94a3b8" font-size="13">🔄 Movements</text>
  <text x="120" y="210" text-anchor="middle" fill="#94a3b8" font-size="13">✅ Reconcile</text>
  <text x="120" y="245" text-anchor="middle" fill="#94a3b8" font-size="13">👤 Customers</text>
  
  <!-- Main Content -->
  <rect x="240" y="0" width="960" height="700" fill="#0f172a"/>
  
  <!-- Header -->
  <text x="280" y="45" fill="white" font-size="24" font-weight="bold">Dashboard</text>
  <text x="280" y="70" fill="#94a3b8" font-size="13">Resumen de conciliación bancaria</text>
  
  <!-- Stat Cards -->
  <rect x="280" y="100" width="160" height="100" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="8"/>
  <text x="360" y="135" text-anchor="middle" fill="#10b981" font-size="28" font-weight="bold">50</text>
  <text x="360" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">Facturas</text>
  <text x="360" y="180" text-anchor="middle" fill="#64748b" font-size="10">30 pagadas</text>
  
  <rect x="460" y="100" width="160" height="100" fill="#1e293b" stroke="#f59e0b" stroke-width="1" rx="8"/>
  <text x="540" y="135" text-anchor="middle" fill="#f59e0b" font-size="28" font-weight="bold">15</text>
  <text x="540" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">Pendientes</text>
  <text x="540" y="180" text-anchor="middle" fill="#64748b" font-size="10">$25,000 UYU</text>
  
  <rect x="640" y="100" width="160" height="100" fill="#1e293b" stroke="#ef4444" stroke-width="1" rx="8"/>
  <text x="720" y="135" text-anchor="middle" fill="#ef4444" font-size="28" font-weight="bold">5</text>
  <text x="720" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">Vencidas</text>
  <text x="720" y="180" text-anchor="middle" fill="#64748b" font-size="10">Requieren atención</text>
  
  <rect x="820" y="100" width="160" height="100" fill="#1e293b" stroke="#3b82f6" stroke-width="1" rx="8"/>
  <text x="900" y="135" text-anchor="middle" fill="#3b82f6" font-size="28" font-weight="bold">200</text>
  <text x="900" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">Movimientos</text>
  <text x="900" y="180" text-anchor="middle" fill="#64748b" font-size="10">180 identificados</text>
  
  <rect x="1000" y="100" width="160" height="100" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" rx="8"/>
  <text x="1080" y="135" text-anchor="middle" fill="#8b5cf6" font-size="28" font-weight="bold">90%</text>
  <text x="1080" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">Automatización</text>
  <text x="1080" y="180" text-anchor="middle" fill="#64748b" font-size="10">Tasa de identificación</text>
  
  <!-- Chart Section -->
  <rect x="280" y="230" width="560" height="250" fill="#1e293b" rx="8"/>
  <text x="310" y="265" fill="white" font-size="14" font-weight="bold">Movimientos Semanales</text>
  
  <!-- Bar chart -->
  <rect x="330" y="350" width="40" height="80" fill="#6366f1" rx="4"/>
  <rect x="330" y="390" width="40" height="40" fill="#f59e0b" rx="4"/>
  <text x="350" y="450" text-anchor="middle" fill="#64748b" font-size="10">Lun</text>
  
  <rect x="390" y="320" width="40" height="110" fill="#6366f1" rx="4"/>
  <rect x="390" y="370" width="40" height="60" fill="#f59e0b" rx="4"/>
  <text x="410" y="450" text-anchor="middle" fill="#64748b" font-size="10">Mar</text>
  
  <rect x="450" y="300" width="40" height="130" fill="#6366f1" rx="4"/>
  <rect x="450" y="360" width="40" height="70" fill="#f59e0b" rx="4"/>
  <text x="470" y="450" text-anchor="middle" fill="#64748b" font-size="10">Mié</text>
  
  <rect x="510" y="330" width="40" height="100" fill="#6366f1" rx="4"/>
  <rect x="510" y="380" width="40" height="50" fill="#f59e0b" rx="4"/>
  <text x="530" y="450" text-anchor="middle" fill="#64748b" font-size="10">Jue</text>
  
  <rect x="570" y="310" width="40" height="120" fill="#6366f1" rx="4"/>
  <rect x="570" y="370" width="40" height="60" fill="#f59e0b" rx="4"/>
  <text x="590" y="450" text-anchor="middle" fill="#64748b" font-size="10">Vie</text>
  
  <rect x="630" y="380" width="40" height="50" fill="#6366f1" rx="4"/>
  <text x="650" y="450" text-anchor="middle" fill="#64748b" font-size="10">Sáb</text>
  
  <rect x="690" y="390" width="40" height="40" fill="#6366f1" rx="4"/>
  <text x="710" y="450" text-anchor="middle" fill="#64748b" font-size="10">Dom</text>
  
  <!-- Summary Panel -->
  <rect x="870" y="230" width="290" height="250" fill="#1e293b" rx="8"/>
  <text x="1015" y="265" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Resumen</text>
  
  <text x="1015" y="310" text-anchor="middle" fill="#6366f1" font-size="36" font-weight="bold">90%</text>
  <text x="1015" y="335" text-anchor="middle" fill="#94a3b8" font-size="12">Automatización</text>
  
  <text x="910" y="380" fill="#94a3b8" font-size="12">Total facturado</text>
  <text x="1120" y="380" text-anchor="end" fill="white" font-size="12">$100,000</text>
  
  <text x="910" y="410" fill="#94a3b8" font-size="12">Total pendiente</text>
  <text x="1120" y="410" text-anchor="end" fill="#f59e0b" font-size="12">$25,000</text>
  
  <text x="910" y="440" fill="#94a3b8" font-size="12">Total pagado</text>
  <text x="1120" y="440" text-anchor="end" fill="#10b981" font-size="12">$60,000</text>
  
  <text x="910" y="470" fill="#94a3b8" font-size="12">Sin identificar</text>
  <text x="1120" y="470" text-anchor="end" fill="#ef4444" font-size="12">20</text>
  
  <!-- Footer -->
  <text x="600" y="680" text-anchor="middle" fill="#475569" font-size="10">Contabilidad — SaaS de conciliación bancaria e IA</text>
</svg>
